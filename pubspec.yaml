name: flow_park_puzzle
description: "Flow & Park Puzzle — a hyper-casual car-parking unblock puzzle with an optional liquid-sort mode."
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Local storage (primary offline store — JSON via shared_preferences, no
  # codegen, works on every platform incl. web)
  shared_preferences: ^2.2.3

  # Backend (cloud save / analytics / leaderboard)
  supabase_flutter: ^2.5.6

  # Ads (mobile only — isolated behind conditional imports so web still builds)
  google_mobile_ads: ^5.1.0

  # In-app purchases (mobile only — likewise isolated for web)
  in_app_purchase: ^3.2.0

  # UX / polish
  google_fonts: ^6.2.1
  confetti: ^0.7.0
  vibration: ^2.0.0
  connectivity_plus: ^6.0.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/branding/

# App icon generation. Save the PARK FLOW logo as assets/icon/app_icon.png
# (square, opaque), then run:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color: "#0E0B1E"
  adaptive_icon_background: "#0E0B1E"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

