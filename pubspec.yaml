name: flow_park_puzzle
description: "Flow & Park Puzzle — a hyper-casual car-parking unblock puzzle with an optional liquid-sort mode."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local storage (primary offline DB)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Backend (cloud save / analytics / leaderboard)
  supabase_flutter: ^2.5.6

  # Ads
  google_mobile_ads: ^5.1.0

  # In-app purchases
  in_app_purchase: ^3.2.0

  # UX / polish
  google_fonts: ^6.2.1
  confetti: ^0.7.0
  vibration: ^2.0.0
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
